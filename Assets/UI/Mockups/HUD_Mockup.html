<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokemon3D HUD Mockup</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      color: #fff;
      background: linear-gradient(180deg, #63b5ff 0%, #3d7fb6 45%, #2c4d67 100%);
      height: 100vh;
      overflow: hidden;
    }
    .hud { position: relative; width: 100%; height: 100%; }
    .panel {
      background: rgba(15, 24, 38, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px);
    }
    .top-left { position: absolute; top: 18px; left: 18px; padding: 12px 16px; min-width: 260px; }
    .bottom-left { position: absolute; bottom: 18px; left: 18px; padding: 12px 16px; min-width: 280px; }
    .bottom-right { position: absolute; bottom: 18px; right: 18px; padding: 12px 16px; min-width: 220px; }
    .bar { height: 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.25); margin-top: 6px; }
    .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #7dff87, #44cc5b); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .action {
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="panel top-left">
      <div><strong>Region:</strong> Verdant Frontier</div>
      <div><strong>Time:</strong> Dusk</div>
      <div><strong>Weather:</strong> Light Rain</div>
    </div>

    <div class="panel bottom-left">
      <div><strong>Player HP</strong> 82%</div>
      <div class="bar"><div class="fill" style="width:82%"></div></div>
      <div style="margin-top:10px"><strong>Companion:</strong> Auralyn (Lv. 22)</div>
      <div><strong>Companion HP</strong> 64%</div>
      <div class="bar"><div class="fill" style="width:64%"></div></div>
    </div>

    <div class="panel bottom-right">
      <div style="margin-bottom:8px"><strong>Quick Actions</strong></div>
      <div class="actions">
        <div class="action">Capture Ball</div>
        <div class="action">Potion</div>
        <div class="action">Call Mount</div>
        <div class="action">Dex</div>
      </div>
    </div>
  </div>
</body>
</html>
